<!DOCTYPE html>
<html data-page-node-id="io4A1vQfsaSZg70eJu1PV2" lang="zh-CN" style="--theme: #ffffff; --text: #2b2b2b; --bg: #d6d6d6; --card: #ffffff; --radius: 16px; --fs: 15px; --tabBg: #ffffff; --tabColor: #9a9a9a; --tabActive: #d6d6d6; --bgBlur: 0px; --bgMask: 0;"><head data-page-node-id="LKi2HYF1CSI2onILzCECjL">

<meta data-page-node-id="w04no1x044U07fA8UxDd1l" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" name="viewport">

<title data-page-node-id="wMJB8Df9MDDDISiCDQs9ec" data-pnid-children="HBOeJHVtjr3KgSOT9lgvF0">属于我和你的见面</title>
<style data-page-node-id="TlCUavP773XXtbrkTHfwJr" data-pnid-children="M9wvvWY3lMm7EuUAUjzdm7">
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--theme:#ff7a9c;--text:#2b2b2b;--bg:#fff5f7;--card:#ffffff;--radius:16px;--fs:15px;
  --tabBg:#ffffff;--tabColor:#9a9a9a;--tabActive:#ff7a9c;--ebH:56px}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Helvetica,sans-serif;
  color:var(--text);font-size:var(--fs);line-height:1.6;background:var(--bg);overflow-x:hidden;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit;outline:none}
#bgLayer{position:fixed;inset:0;z-index:0;background-color:var(--bg);background-size:cover;background-position:center;background-repeat:no-repeat}
#bgLayer::after{content:"";position:absolute;inset:0;background:var(--bg);opacity:var(--bgMask,0);
  backdrop-filter:blur(var(--bgBlur,0px));-webkit-backdrop-filter:blur(var(--bgBlur,0px))}
#app{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column}
#topbar{position:sticky;top:0;z-index:30;height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;
  background:rgba(255,255,255,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(0,0,0,.05)}
#topbar .tb-title{font-weight:700;font-size:16px;flex:1;text-align:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 6px}
.tb-btn{padding:5px 12px;border-radius:20px;background:var(--theme);color:#fff;font-size:13px;font-weight:600;white-space:nowrap}
.tb-btn.ghost{background:rgba(0,0,0,.06);color:var(--text)}
#content{flex:1;padding:14px 12px 96px}
.panel{display:none}
.panel.on{display:block;animation:fade .26s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.blk{position:relative;border-radius:var(--radius);overflow:hidden}
.blk-t{padding:14px 16px 6px;font-size:calc(var(--fs) + 2px);font-weight:700}
.blk-t.left{text-align:left}.blk-t.center{text-align:center}.blk-t.right{text-align:right}
.blk-t.left::before{content:"";display:inline-block;width:4px;height:.95em;border-radius:2px;background:var(--theme);vertical-align:-2px;margin-right:6px}
.blk-b{padding:14px 16px}
.blk-t + .blk-b{padding-top:8px}
.blk-tools{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;padding:8px 4px 0}
.blk-tools button{background:rgba(255,255,255,.9);border-radius:8px;padding:5px 10px;font-size:12px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.blk-tools button[data-act="del"]{background:#ffe8ec;color:#e0415f}
.blk-tools button[data-act="set"]{background:var(--theme);color:#fff}
.blk.editing{outline:2px dashed var(--theme);outline-offset:2px}
.pf{display:flex;gap:14px;align-items:center}
.pf.top{flex-direction:column;text-align:center}
.pf.right{flex-direction:row-reverse}
.pf-av{width:84px;height:84px;border-radius:50%;object-fit:cover;background:#eee;flex-shrink:0;border:3px solid var(--theme);
  display:flex;align-items:center;justify-content:center;font-size:32px}
.pf.top .pf-av{width:96px;height:96px}
.pf-info{flex:1;min-width:0}
.pf-name{font-size:calc(var(--fs) + 6px);font-weight:800;line-height:1.3}
.pf-meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.pf-cell{display:flex;align-items:center;gap:4px;font-size:12.5px;background:rgba(0,0,0,.05);padding:4px 9px;border-radius:10px}
.pf-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.pf-tag{font-size:12px;padding:3px 10px;border-radius:20px;background:var(--theme);color:#fff;font-weight:600;opacity:.85}
.pf-intro{margin-top:11px;font-size:calc(var(--fs) - 1px);opacity:.9;white-space:pre-wrap;word-break:break-word}
.tx{white-space:pre-wrap;word-break:break-word}
.imgs{display:grid;gap:8px}
.imgs.c2{grid-template-columns:1fr 1fr}.imgs.c3{grid-template-columns:1fr 1fr 1fr}
.imgs figure{overflow:hidden;border-radius:10px;background:#f2f2f2}
.imgs img{width:100%;object-fit:cover}
.imgs figcaption{font-size:12px;opacity:.75;padding:5px 6px;text-align:center}
.tb-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.ct{border-collapse:collapse;width:100%;font-size:13px}
table.ct td,table.ct th{border:1px solid rgba(0,0,0,.12);padding:8px 10px;text-align:left}
table.ct thead th{background:var(--theme);color:#fff;font-weight:700;border-color:transparent}
table.ct tbody tr:nth-child(even) td{background:rgba(0,0,0,.03)}
.cd{display:flex;flex-direction:column;gap:10px}
.cd-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:rgba(0,0,0,.04)}
.cd-num{font-size:25px;font-weight:800;line-height:1;min-width:66px;text-align:center;color:var(--theme)}
.cd-num small{display:block;font-size:11px;font-weight:500;opacity:.7;margin-top:3px}
.cd-txt b{display:block;font-size:14px}
.cd-txt span{font-size:12px;opacity:.65}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head b{font-size:15px}
.cal-head button{padding:4px 13px;border-radius:8px;background:rgba(0,0,0,.06);font-size:14px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-w{text-align:center;font-size:11px;opacity:.55;padding:4px 0}
.cal-d{position:relative;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;font-size:13px}
.cal-d.out{opacity:.22}
.cal-d.today{background:var(--theme);color:#fff;font-weight:700}
.cal-d s{position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:var(--theme);text-decoration:none}
.cal-d u{text-decoration:none;font-size:9px;line-height:1;margin-top:1px;max-width:100%;overflow:hidden;white-space:nowrap}
.audio{display:flex;flex-direction:column;gap:10px}
.au-item{display:flex;align-items:center;gap:11px;padding:9px;border-radius:14px;background:rgba(0,0,0,.04)}
.au-cover{width:46px;height:46px;border-radius:10px;object-fit:cover;background:#ddd;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:20px}
.au-play{width:38px;height:38px;border-radius:50%;background:var(--theme);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.au-info{flex:1;min-width:0}
.au-info b{display:block;font-size:14px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.au-info span{font-size:11.5px;opacity:.6}
.links{display:flex;flex-direction:column;gap:9px}
.links.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.lk{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:14px;background:rgba(0,0,0,.04)}
.lk-ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;background:#fff;flex-shrink:0}
.lk-tx b{font-size:14px;display:block}
.lk-tx span{font-size:11.5px;opacity:.6}
.lk-ar{margin-left:auto;opacity:.4;font-size:16px}
.poll-q{font-size:15px;font-weight:700;margin-bottom:10px}
.poll-opt{display:block;width:100%;text-align:left;padding:11px 13px;border-radius:12px;background:rgba(0,0,0,.04);margin-bottom:8px;position:relative;overflow:hidden}
.poll-opt.sel{outline:2px solid var(--theme)}
.poll-bar{position:absolute;left:0;top:0;bottom:0;background:var(--theme);opacity:.22}
.poll-opt b{position:relative;display:flex;justify-content:space-between;gap:8px;font-weight:500}
.poll-opt.sel b{font-weight:700;color:var(--theme)}
.poll-tip{font-size:11.5px;opacity:.55;margin-top:4px}
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:var(--tabBg);
  border-top:1px solid rgba(0,0,0,.06);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 14px rgba(0,0,0,.05)}
.tab{flex:1;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--tabColor);font-size:11px;position:relative}
.tab i{font-style:normal;font-size:20px;line-height:1}
.tab.on{color:var(--tabActive);font-weight:700}
.tab em{position:absolute;top:2px;right:calc(50% - 24px);font-size:9px;font-style:normal;background:var(--theme);color:#fff;border-radius:8px;padding:0 4px}
#editbar{position:fixed;left:0;right:0;bottom:0;z-index:46;display:none;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.97);border-top:1px solid rgba(0,0,0,.08)}
#editbar.on{display:flex}
#editbar button{flex:1;padding:10px 2px;border-radius:11px;background:rgba(0,0,0,.06);font-size:12px;font-weight:600}
#editbar button.p{background:var(--theme);color:#fff}
body.editing #tabbar{bottom:var(--ebH)}
body.editing #content{padding-bottom:calc(96px + var(--ebH))}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fff;border-radius:18px 18px 0 0;
  box-shadow:0 -6px 30px rgba(0,0,0,.18);transform:translateY(102%);transition:transform .26s cubic-bezier(.32,.72,0,1);
  max-height:84vh;display:flex;flex-direction:column}
#sheet.on{transform:none}
.sh-hd{display:flex;align-items:center;justify-content:space-between;padding:13px 16px 9px;border-bottom:1px solid rgba(0,0,0,.07)}
.sh-hd b{font-size:16px}
.sh-bd{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 16px 20px}
.sh-ft{display:flex;gap:9px;padding:10px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid rgba(0,0,0,.07)}
.btn{flex:1;padding:11px;border-radius:12px;background:rgba(0,0,0,.06);font-weight:600;font-size:14px;text-align:center}
.btn.p{background:var(--theme);color:#fff}
.btn.d{background:#ffe8ec;color:#e0415f}
.f{margin-bottom:12px}
.f > label{display:block;font-size:12.5px;font-weight:600;opacity:.75;margin-bottom:5px}
.f input[type=text],.f input[type=date],.f textarea,.f select{width:100%;padding:9px 11px;border-radius:10px;border:1px solid rgba(0,0,0,.14);background:#fff;font-size:14px}
.f textarea{min-height:86px;resize:vertical;line-height:1.55}
.f .row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.f input[type=range]{flex:1;min-width:120px}
.f .hint{font-size:11.5px;opacity:.55;margin-top:4px;line-height:1.7}
.cval{font-size:12px;opacity:.7}
.colorbox{display:flex;align-items:center;gap:8px}
.colorbox input[type=color]{width:42px;height:34px;border:none;background:none;padding:0}
.mini{padding:7px 11px;border-radius:9px;background:rgba(0,0,0,.06);font-size:12.5px;white-space:nowrap}
.mini.p{background:var(--theme);color:#fff}
.mini.d{background:#ffe8ec;color:#e0415f}
.card-item{border:1px solid rgba(0,0,0,.1);border-radius:12px;padding:10px;margin-bottom:9px;background:rgba(0,0,0,.015)}
.ci-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;font-size:12px;font-weight:700;opacity:.7}
.ci-hd .mini{padding:4px 8px;font-size:11.5px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:7px 13px;border-radius:9px;background:rgba(0,0,0,.06);font-size:13px}
.seg button.on{background:var(--theme);color:#fff;font-weight:600}
.tbl-edit{overflow-x:auto}
.tbl-edit input{width:100%;min-width:62px;padding:6px 7px;border:1px solid rgba(0,0,0,.14);border-radius:7px;font-size:12.5px}
.thumb{width:52px;height:52px;border-radius:9px;object-fit:cover;background:#eee;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.fab-add{width:100%;padding:13px;border-radius:14px;background:var(--theme);color:#fff;font-weight:700;font-size:15px;margin:6px 0 4px}
.empty{text-align:center;opacity:.45;padding:18px;font-size:13px}
#mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:55;opacity:0;pointer-events:none;transition:opacity .2s}
#mask.on{opacity:1;pointer-events:auto}
#modal{position:fixed;z-index:70;left:50%;top:50%;transform:translate(-50%,-50%) scale(.94);width:min(88vw,420px);
  background:#fff;border-radius:16px;padding:18px;opacity:0;pointer-events:none;transition:.2s;max-height:80vh;overflow-y:auto}
#modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
#modal h4{font-size:16px;margin-bottom:10px}
#modal p{font-size:13px;opacity:.8;margin-bottom:10px}
#modal input[type=text],#modal textarea{width:100%;padding:10px;border:1px solid rgba(0,0,0,.16);border-radius:10px;font-size:14px}
#modal textarea{min-height:110px}
#modal .mb{display:flex;gap:9px;margin-top:14px}
#lightbox{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:18px}
#lightbox.on{display:flex}
#lightbox img{max-width:100%;max-height:82vh;border-radius:8px}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);z-index:99;background:rgba(0,0,0,.84);color:#fff;
  padding:9px 16px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;max-width:82vw;text-align:center}
#toast.on{opacity:1}
</style>

/* ========== 存取 ========== */
function save(){try{localStorage.setItem(LS_CFG,JSON.stringify(CFG))}catch(e){toast('本地保存失败（存储空间不足？）')}}
function mergeCfg(src,base){
  var c=clone(base);if(!src)return c;
  if(src.meta)for(var k in src.meta){if(k!=='code')c.meta[k]=src.meta[k]}
  if(Array.isArray(src.tabs)&&src.tabs.length)c.tabs=clone(src.tabs);
  return c;
}
async function load(){
  var base=defaultConfig();
  CFG=window.__EMBED__?mergeCfg(window.__EMBED__,base):base;
  if(/^https?:$/.test(location.protocol)){
    try{var r=await fetch('config.json?t='+Date.now(),{cache:'no-store'});
      if(r.ok)CFG=mergeCfg(await r.json(),defaultConfig())}catch(e){}
  }
  var m=/[#&]d=([^&]+)/.exec(location.hash||'');
  if(m){try{CFG=mergeCfg(await unpack(decodeURIComponent(m[1])),defaultConfig())}
    catch(e){toast('链接数据读取失败，请让对方改用「下载网页文件」分享')}}
  else if(!window.__EMBED__){try{var s=localStorage.getItem(LS_CFG);if(s)CFG=mergeCfg(JSON.parse(s),defaultConfig())}catch(e){}}
  renderApp();
  if(/(^|[?&#])e=1($|&)/.test(location.hash||location.search))doEnter();
}

function ownerCode(){return localStorage.getItem(LS_CODE)||DEF_CODE}

  openModal('进入编辑模式','<p>本页仅作者可修改，请输入授权码：</p><input type="text" id="codeIn" placeholder="授权码" style="letter-spacing:3px">',
   [{t:'取消',c:'btn'},{t:'进入',c:'btn p',f:function(){var v=($('#codeIn').value||'').trim();

function fld(f,obj){
  var v=getP(obj,f.k),h='<div class="f"><label>'+esc(f.l)+'</label>',t=f.t;
  if(t==='text'||t==='url')h+='<input type="text" data-k="'+f.k+'" value="'+esc(v==null?'':v)+'" placeholder="'+esc(f.ph||(t==='url'?'https://...':''))+'">';
  else if(t==='date')h+='<input type="date" data-k="'+f.k+'" value="'+esc(v==null?'':v)+'">';
  else if(t==='textarea')h+='<textarea data-k="'+f.k+'" placeholder="'+esc(f.ph||'')+'">'+esc(v==null?'':v)+'</textarea>';
  else if(t==='number'){var nv=(v==null?(f.def||0):v);
    h+='<div class="row"><input type="range" min="'+(f.min!=null?f.min:0)+'" max="'+(f.max!=null?f.max:100)+'" step="'+(f.step||1)+
      '" value="'+nv+'" data-k="'+f.k+'"><span class="cval" style="width:40px;text-align:right">'+nv+'</span></div>'}
  else if(t==='switch'){var on=(v===true||v==='1'||v===1);
    h+='<div class="seg"><button data-k="'+f.k+'" data-t="bool" data-v="1" class="'+(on?'on':'')+'">开</button>'+
       '<button data-k="'+f.k+'" data-t="bool" data-v="0" class="'+(!on?'on':'')+'">关</button></div>'}
  else if(t==='select')h+='<div class="seg">'+f.o.map(function(o){
    return '<button data-k="'+f.k+'" data-v="'+esc(o[0])+'" class="'+(String(v)===String(o[0])?'on':'')+'">'+esc(o[1])+'</button>'}).join('')+'</div>';
  else if(t==='color')h+='<div class="colorbox"><input type="color" data-k="'+f.k+'" value="'+(/^#[0-9a-fA-F]{6}$/.test(v||'')?v:'#ff7a9c')+
    '"><span class="cval" style="flex:1">'+(v||'跟随默认')+'</span><button class="mini" data-clear="'+f.k+'">恢复默认</button></div>';
  else if(t==='image'){var s=imgSrc(v);
    h+='<div class="row">'+(s?'<img class="thumb" src="'+esc(s)+'" alt="">':'<div class="thumb">🖼</div>')+
      '<button class="mini" data-up="'+f.k+'">上传图片</button><button class="mini" data-url="'+f.k+'">粘贴图片链接</button>'+
      '<button class="mini d" data-clear="'+f.k+'">清除</button></div>'+
      '<div class="hint">图片会存进网页；想让分享链接更短，建议用图床「粘贴图片链接」</div>'}
  else if(t==='tags')h+='<input type="text" data-tags="1" data-k="'+f.k+'" value="'+esc(toTags(v).join(' / '))+'" placeholder="猫系 / 夜猫子 / INFP">'+
      '<div class="hint">多个标签用斜杠 / 分隔</div>';
  else if(t==='items')h+=itemsHtml(f,v||[],obj);
  else if(t==='table')h+=tableHtml(f,v||[]);
  if(f.hint&&t!=='image'&&t!=='tags')h+='<div class="hint">'+esc(f.hint)+'</div>';
  return h+'</div>';
}

function baseUrl(){return location.href.split('#')[0].split('?')[0]}
async function shareSheet(){
  var data=clone(CFG);delete data.meta.code;
  openSheet('分享 / 保存',
   '<div class="f"><label>分享链接（内容已压缩进网址，微信可直接打开）</label>'+
   '<textarea id="shareUrl" readonly style="min-height:78px">生成中…</textarea><div class="hint" id="shareLen"></div></div>'+
   '<button class="btn p" id="copyUrl" style="width:100%;margin-bottom:10px">复制分享链接</button>'+
   '<div class="f"><label>协作链接（对方打开即可编辑）</label>'+
   '<textarea id="coUrl" readonly style="min-height:60px">生成中…</textarea></div>'+
   '<button class="btn" id="copyCo" style="width:100%;margin-bottom:10px">复制协作链接</button>'+
   '<button class="btn" id="dlHtml" style="width:100%;margin-bottom:8px">下载网页文件（单文件 HTML）</button>'+
   '<button class="btn" id="cpHtml" style="width:100%">复制网页源码</button>'+
   '<div class="hint" style="margin-top:10px">链接超过约 8000 字符时可能被部分场景截断，此时建议改用「下载网页文件」，或把图片改成外链。<br>'+
   '已把本页放到自己的服务器 / 网盘？用「下载网页文件」覆盖旧文件，访客刷新即可看到最新内容。</div>',
   '<button class="btn" data-sh="close">关闭</button>');
  var p=await pack(data),u=baseUrl()+'#d='+p,cu=baseUrl()+'#e=1&d='+p;
  $('#shareUrl').value=u;$('#coUrl').value=cu;
  $('#shareLen').textContent='数据大小约 '+(p.length/1024).toFixed(1)+' KB（'+p.length+' 字符）'+(p.length>8000?' ⚠ 偏长，建议下载网页文件':'');
  $('#copyUrl').onclick=function(){copyText(u)};
  $('#copyCo').onclick=function(){copyText(cu)};
  $('#dlHtml').onclick=doExport;
  $('#cpHtml').onclick=async function(){copyText(await buildHtml())};
}
function copyText(t){
  var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.top='-1000px';
  document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,t.length);
  var ok=false;try{ok=document.execCommand('copy')}catch(e){}
  document.body.removeChild(ta);
  if(!ok&&navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){toast('已复制')},function(){toast('复制失败，请手动长按复制')});return}
  toast(ok?'已复制到剪贴板':'请手动长按选中复制');
}
async function buildHtml(){
  var data=clone(CFG);delete data.meta.code;
  var json=JSON.stringify(data).replace(/</g,'\\u003c');
  var k1=$('#content').innerHTML,k2=$('#tabbar').innerHTML,k3=$('#shBody').innerHTML;
  var wasEdit=state.edit;
  if(wasEdit){state.edit=false;document.body.classList.remove('editing');
    $('#editbar').classList.remove('on');$('#btnEdit').textContent='✎ 编辑';
    $('#sheet').classList.remove('on');$('#modal').classList.remove('on');
    $('#editbar').style.visibility='';}
  $('#content').innerHTML='';$('#tabbar').innerHTML='';$('#shBody').innerHTML='';
  var html='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
  $('#content').innerHTML=k1;$('#tabbar').innerHTML=k2;$('#shBody').innerHTML=k3;
  if(wasEdit){state.edit=true;document.body.classList.add('editing');
    $('#editbar').classList.add('on');$('#btnEdit').textContent='✓ 完成';}
  return html.replace('window.__EMBED__=null','window.__EMBED__='+json);
}
async function doExport(){
  try{var html=await buildHtml();
    var blob=new Blob([html],{type:'text/html;charset=utf-8'}),a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download=(CFG.meta.title||'我的主页')+'.html';
    document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000);
    toast('网页文件已生成');
  }catch(e){toast('导出失败，请改用「复制网页源码」')}
}

/* ========== 图片压缩 ========== */
function pickImage(cb){
  var i=document.createElement('input');i.type='file';i.accept='image/*';
  i.onchange=function(){var f=i.files&&i.files[0];if(!f)return;
    var r=new FileReader();
    r.onload=function(){var im=new Image();
      im.onload=function(){var w=im.width,h=im.height,s=Math.min(1,1000/Math.max(w,h));
        w=Math.round(w*s);h=Math.round(h*s);
        var c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d');
        x.fillStyle='#ffffff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
        cb(c.toDataURL('image/jpeg',0.82));};
      im.src=r.result;};
    r.readAsDataURL(f);};
  i.click();
}

    var y=+cm.split('-')[0],m=+cm.split('-')[1]+d;

    try{my=JSON.parse(localStorage.getItem(key)||'[]')}catch(err){}

      if(k>=0){my.splice(k,1);o[ix].votes=Math.max(0,(+o[ix].votes||0)-1)}

    editBlock(el.dataset.id);return}

    CFG.tabs.splice(+el.dataset.tdel,1);if(state.tab>=CFG.tabs.length)state.tab=0;
    closeSheet();renderApp();save();return}
  if((el=e.target.closest('[data-tmv]'))){syncSheet();var p6=el.dataset.tmv.split('|'),i4=+p6[0],d4=+p6[1];
    if(i4+d4>=0&&i4+d4<CFG.tabs.length)CFG.tabs.splice(i4+d4,0,CFG.tabs.splice(i4,1)[0]);refreshSheet();renderApp();return}
  if((el=e.target.closest('[data-duptab]'))){syncSheet();var t2=clone(CFG.tabs[+el.dataset.duptab]);t2.id=uid();
    t2.blocks.forEach(function(b){b.id=uid()});CFG.tabs.splice(+el.dataset.duptab+1,0,t2);
    closeSheet();renderApp();save();return}
  if((el=e.target.closest('[data-deltab]'))){if(!confirm('删除这一页及其所有区块？'))return;
    if(CFG.tabs.length<=1){toast('至少要保留一个页面');return}
    CFG.tabs.splice(+el.dataset.deltab,1);if(state.tab>=CFG.tabs.length)state.tab=0;
    closeSheet();renderApp();save();return}
  if((el=e.target.closest('[data-up]'))){var k1=el.dataset.up;syncSheet();
    pickImage(function(d){put(k1,d);renderApp();save();refreshSheet()});return}
  if((el=e.target.closest('[data-url]'))){var k2=el.dataset.url;syncSheet();
    openModal('粘贴图片链接','<input type="text" id="urlIn" placeholder="https://..." value="'+esc(getP(state.curBlock,k2)||getP(CFG,k2)||'')+'">',
     [{t:'取消',c:'btn'},{t:'确定',c:'btn p',f:function(){
       var v=$('#urlIn').value.trim();put(k2,v);closeModal();renderApp();save();refreshSheet()}}]);return}
  if((el=e.target.closest('[data-clear]'))){var k3=el.dataset.clear;syncSheet();put(k3,'');renderApp();save();refreshSheet();return}
  if((el=e.target.closest('[data-k][data-v]'))){
    var kv=el.dataset.k,vv=el.dataset.v;
    if(el.dataset.t==='bool')vv=(vv==='1');
    put(kv,vv);
    $$('#shBody [data-k="'+kv+'"]').forEach(function(x){if(x.dataset.v!==undefined)x.classList.toggle('on',x.dataset.v===String(el.dataset.v))});
    scheduleRender();return}
  if(e.target.closest('[data-sh]')){closeSheet();return}
  if(e.target.id==='shClose'||e.target.id==='mask'){closeSheet();closeModal();return}
  if(e.target.id==='btnEdit'){state.edit?exitEdit():enterEdit();return}
  if(e.target.id==='btnHome'){window.scrollTo({top:0,behavior:'smooth'});return}
  if(e.target.id==='saveCode'){var v2=($('#newCode').value||'').trim();
    if(!v2){toast('授权码不能为空');return}
    localStorage.setItem(LS_CODE,v2);toast('授权码已更新为：'+v2);return}
  if(e.target.id==='btnReset'){if(!confirm('恢复为默认示例内容？当前编辑将丢失'))return;
    CFG=defaultConfig();closeSheet();renderApp();save();toast('已恢复默认');return}
  if(e.target.id==='btnExportJson'){var j=clone(CFG);delete j.meta.code;copyText(JSON.stringify(j));return}
  if(e.target.id==='btnImport'){openModal('导入配置','<textarea id="impTa" placeholder="在这里粘贴配置 JSON"></textarea>',
    [{t:'取消',c:'btn'},{t:'导入',c:'btn p',f:function(){
      try{CFG=mergeCfg(JSON.parse($('#impTa').value),defaultConfig());closeModal();closeSheet();renderApp();save();toast('导入成功')}
      catch(err){toast('JSON 格式错误')}}}]);return}
});
document.addEventListener('input',function(e){
  var el=e.target.closest('[data-k]');
  if(!el||!$('#sheet').classList.contains('on')||el.type==='color')return;
  var v=el.value;if(el.type==='range'){v=+v;var sp=el.nextElementSibling;if(sp&&sp.classList&&sp.classList.contains('cval'))sp.textContent=v}
  if(el.dataset.tags)v=toTags(v);
  put(el.dataset.k,v);
  if(el.dataset.k==='meta.title'){document.title=v;$('#tbTitle').textContent=v}
  scheduleRender();
});
document.addEventListener('change',function(e){
  var el=e.target.closest('input[type=color][data-k]');if(!el)return;
  put(el.dataset.k,el.value);
  var cv=el.parentElement.querySelector('.cval');if(cv)cv.textContent=el.value;
  scheduleRender();
});

load();
</script>


</body></html>
